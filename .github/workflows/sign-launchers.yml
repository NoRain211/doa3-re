# Builds a release's Launcher.exe and DOA3.exe and has SignPath sign them
# (README.md, Code signing policy). Run it on the release commit; each request
# waits for an approver on SignPath. tools/package_test.py --signed packages the result.
name: sign-launchers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.6.3
        required: true

permissions:
  actions: read
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the launchers
        env:
          VERSION: ${{ inputs.version }}
        run: python tools/package_test.py $env:VERSION --launchers build/launchers
      - name: Upload the unsigned launchers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-launchers
          path: |
            build/launchers/Launcher.exe
            build/launchers/DOA3.exe
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: doa3-re
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # An approver signs off by hand.
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: build/signed
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - name: Upload the signed launchers
        uses: actions/upload-artifact@v4
        with:
          name: signed-launchers-${{ inputs.version }}
          path: build/signed
